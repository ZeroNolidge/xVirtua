name: Deploy

# Manual deploy to the Firebase project in the FIREBASE_SERVICE_ACCOUNT secret.
# You must pass project_id, and it must match the key, or nothing is deployed.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project ID to deploy to (must match the key in FIREBASE_SERVICE_ACCOUNT)'
        required: true
      only:
        description: 'What to deploy (comma-separated)'
        required: false
        default: 'firestore,storage,functions,hosting'
      faculty_email:
        description: 'Optional: invite this email as the first faculty member'
        required: false
        default: ''

concurrency: deploy
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Google credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPECTED: ${{ inputs.project_id }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT secret is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          PID=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$RUNNER_TEMP/sa.json")
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$PID" >> "$GITHUB_ENV"
          echo "Target project: $PID"
          if [ "$PID" != "$EXPECTED" ]; then
            echo "::error::The key is for project '$PID', but you asked to deploy to '$EXPECTED'. Nothing was deployed."
            exit 1
          fi

      - name: Checks
        run: |
          npm run lint
          npm run build
          npm run typecheck
          npm test
          npm run test:rules
          npm run test:functions

      - name: Build web app with this project's config
        run: |
          node scripts/write-web-env.mjs
          npm run build -w web

      - name: Prepare functions for Cloud Build
        # The shared package is bundled into functions/lib, so Cloud Build
        # must not try to install it from npm.
        run: npm pkg delete "dependencies.@plainspeak/shared" -w functions

      - name: Deploy
        env:
          ONLY: ${{ inputs.only }}
        run: npx firebase deploy --project "$PROJECT_ID" --only "$ONLY" --non-interactive --force

      - name: Allow the app to call callable functions
        # Callables check auth themselves, but Cloud Run must let browser
        # requests through. The Firebase CLI can skip this on updates.
        if: ${{ contains(inputs.only, 'functions') }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          SERVICES=$(gcloud run services list --project "$PROJECT_ID" --region us-east1 \
            --filter='metadata.labels.deployment-callable=true' --format='value(metadata.name)')
          if [ -z "$SERVICES" ]; then echo "::error::No callable services found"; exit 1; fi
          for s in $SERVICES; do
            echo "Allowing public invoke: $s"
            gcloud run services add-iam-policy-binding "$s" --project "$PROJECT_ID" --region us-east1 \
              --member=allUsers --role=roles/run.invoker --quiet >/dev/null
          done

      - name: Invite first faculty member
        if: ${{ inputs.faculty_email != '' }}
        env:
          FACULTY_EMAIL: ${{ inputs.faculty_email }}
        run: npx tsx scripts/bootstrap.ts --email "$FACULTY_EMAIL" --prod

      - name: Summary
        run: echo "### Deployed to https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
