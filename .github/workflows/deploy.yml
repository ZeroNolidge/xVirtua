name: Deploy

# Manual deploy to the Firebase project in the FIREBASE_SERVICE_ACCOUNT secret.
# You must pass project_id, and it must match the key, or nothing is deployed.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project ID to deploy to (must match the key in FIREBASE_SERVICE_ACCOUNT)'
        required: true
      only:
        description: 'What to deploy (comma-separated)'
        required: false
        default: 'firestore,storage,functions,hosting'
      seed_content:
        description: 'Load seed scenarios (as drafts) and the jargon dictionary. Never overwrites edits.'
        type: boolean
        default: false
      faculty_email:
        description: 'Optional: invite this email as the first faculty member'
        required: false
        default: ''
      app_check:
        description: 'App Check: enforce (block requests not from the app), monitor (tokens only), or off'
        type: choice
        options: [enforce, monitor, 'off']
        default: enforce

concurrency: deploy
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Google credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPECTED: ${{ inputs.project_id }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT secret is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          PID=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).project_id)" "$RUNNER_TEMP/sa.json")
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$PID" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$PID" >> "$GITHUB_ENV"
          echo "Target project: $PID"
          if [ "$PID" != "$EXPECTED" ]; then
            echo "::error::The key is for project '$PID', but you asked to deploy to '$EXPECTED'. Nothing was deployed."
            exit 1
          fi

      - name: Checks
        run: |
          npm run lint
          npm run build
          npm run typecheck
          npm test
          npm run test:rules
          npm run test:functions

      - name: Set up App Check
        id: appcheck
        if: ${{ inputs.app_check != 'off' }}
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          bash scripts/setup-app-check.sh

      - name: App Check status
        if: ${{ inputs.app_check != 'off' && steps.appcheck.outcome != 'success' }}
        run: |
          echo "::warning::App Check could not be set up, so it stays off for this deploy. The deploy account needs the 'reCAPTCHA Enterprise Admin' and 'Firebase App Check Admin' roles (IAM → plainspeak-deployer)."

      - name: Build web app with this project's config
        run: |
          node scripts/write-web-env.mjs
          npm run build -w web

      - name: Functions settings
        # APP_CHECK_ENFORCE makes every function reject requests without a valid App Check token.
        run: |
          if [ "${{ inputs.app_check }}" = "enforce" ] && [ -n "${APPCHECK_SITE_KEY:-}" ]; then
            echo "APP_CHECK_ENFORCE=true" > functions/.env
          else
            echo "APP_CHECK_ENFORCE=false" > functions/.env
          fi
          cat functions/.env

      - name: Prepare functions for Cloud Build
        # The shared package is bundled into functions/lib, so Cloud Build
        # must not try to install it from npm.
        run: npm pkg delete "dependencies.@plainspeak/shared" -w functions

      - name: Sync API keys to Secret Manager
        # Copies GitHub secrets into Google Secret Manager (only when changed),
        # where the functions read them. Values are never printed.
        if: ${{ contains(inputs.only, 'functions') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          for NAME in ANTHROPIC_API_KEY OPENAI_API_KEY CARTESIA_API_KEY; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then echo "::error::GitHub secret $NAME is missing"; exit 1; fi
            CURRENT=$(npx firebase functions:secrets:access "$NAME" --project "$PROJECT_ID" 2>/dev/null || true)
            if [ "$CURRENT" = "$VALUE" ]; then echo "$NAME unchanged"; continue; fi
            printf '%s' "$VALUE" | npx firebase functions:secrets:set "$NAME" --data-file=- --project "$PROJECT_ID" --non-interactive --force >/dev/null
            echo "$NAME updated"
          done

      - name: Deploy
        env:
          ONLY: ${{ inputs.only }}
        run: npx firebase deploy --project "$PROJECT_ID" --only "$ONLY" --non-interactive --force

      - name: Allow the app to call callable functions
        # Callables check auth themselves, but Cloud Run must let browser
        # requests through. The Firebase CLI can skip this on updates.
        if: ${{ contains(inputs.only, 'functions') }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          SERVICES=$(gcloud run services list --project "$PROJECT_ID" --region us-east1 \
            --filter='metadata.labels.deployment-callable=true' --format='value(metadata.name)')
          if [ -z "$SERVICES" ]; then echo "::error::No callable services found"; exit 1; fi
          for s in $SERVICES; do
            echo "Allowing public invoke: $s"
            gcloud run services add-iam-policy-binding "$s" --project "$PROJECT_ID" --region us-east1 \
              --member=allUsers --role=roles/run.invoker --quiet >/dev/null
          done

      - name: Enforce App Check on Firestore and Storage
        if: ${{ inputs.app_check == 'enforce' && env.APPCHECK_SITE_KEY != '' && contains(inputs.only, 'hosting') }}
        continue-on-error: true
        run: |
          TOKEN=$(gcloud auth print-access-token)
          for SVC in firestore.googleapis.com firebasestorage.googleapis.com; do
            curl -sSf -X PATCH \
              "https://firebaseappcheck.googleapis.com/v1/projects/$PROJECT_ID/services/$SVC?updateMask=enforcementMode" \
              -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT_ID" \
              -H 'Content-Type: application/json' -d '{"enforcementMode":"ENFORCED"}' >/dev/null
            echo "App Check enforced: $SVC"
          done

      - name: Audio storage lifecycle (cheaper tier at 90 days, delete at 3 years)
        if: ${{ contains(inputs.only, 'storage') }}
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          BUCKET=$(grep VITE_FIREBASE_STORAGE_BUCKET web/.env.production.local | cut -d= -f2)
          gcloud storage buckets update "gs://$BUCKET" --lifecycle-file=storage-lifecycle.json --project "$PROJECT_ID"
          gcloud storage buckets describe "gs://$BUCKET" --format='json(lifecycle_config)'

      - name: Seed content
        if: ${{ inputs.seed_content }}
        run: npx tsx scripts/seed-content.ts --prod

      - name: Invite first faculty member
        if: ${{ inputs.faculty_email != '' }}
        env:
          FACULTY_EMAIL: ${{ inputs.faculty_email }}
        run: npx tsx scripts/bootstrap.ts --email "$FACULTY_EMAIL" --prod

      - name: Summary
        run: |
          echo "### Deployed to https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "App Check: ${{ inputs.app_check }} (site key $([ -n "${APPCHECK_SITE_KEY:-}" ] && echo set || echo missing))" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
