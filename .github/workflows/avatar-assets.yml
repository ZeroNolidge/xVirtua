name: Avatar assets

# Downloads a patient's portraits and body-language clips (listed in
# scripts/avatar-sources/<patient>.json), shrinks them for phones, and commits
# them to web/public/avatars/<patient>/ on this branch.
on:
  workflow_dispatch:
    inputs:
      patient:
        description: 'Patient folder name, e.g. ray-kowalski'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Download and convert
        env:
          PATIENT: ${{ inputs.patient }}
        run: |
          set -euo pipefail
          [[ "$PATIENT" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad patient name"; exit 1; }
          SRC="scripts/avatar-sources/$PATIENT.json"
          OUT="web/public/avatars/$PATIENT"
          # Optional per-patient touch-up for the clips (e.g. sharpening and a small
          # brightness lift so they match the live Simli face): an ffmpeg filter.
          FIX=""
          if [ -f "scripts/avatar-sources/$PATIENT.filter" ]; then
            FIX="$(tr -d '\n' < "scripts/avatar-sources/$PATIENT.filter"),"
            [[ "$FIX" =~ ^[a-z0-9=:.,_-]+,$ ]] || { echo "::error::bad filter"; exit 1; }
          fi
          mkdir -p "$OUT" "$RUNNER_TEMP/raw"
          for name in $(jq -r 'keys[]' "$SRC"); do
            [[ "$name" =~ ^[a-z0-9-]+\.(jpg|mp4)$ ]] || { echo "::error::bad file name $name"; exit 1; }
            url=$(jq -r --arg n "$name" '.[$n]' "$SRC")
            # Optional per-clip speed-up (quicker flashes of emotion), from <patient>.speed.json.
            SPEED=$(jq -r --arg n "$name" '.[$n] // 1' "scripts/avatar-sources/$PATIENT.speed.json" 2>/dev/null || echo 1)
            [[ "$SPEED" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::bad speed for $name"; exit 1; }
            PACE=""
            [ "$SPEED" != "1" ] && PACE="setpts=PTS/$SPEED,fps=24,"
            curl -sSfL "$url" -o "$RUNNER_TEMP/raw/$name.src"
            case "$name" in
              *.jpg)
                # Square, 768 px (the avatar's size on screen), small file.
                ffmpeg -loglevel error -y -i "$RUNNER_TEMP/raw/$name.src" -vf scale=768:768 -q:v 4 "$OUT/$name" ;;
              *.mp4)
                # 768 px, H.264 (plays everywhere), no sound, starts playing at once.
                ffmpeg -loglevel error -y -i "$RUNNER_TEMP/raw/$name.src" -vf "${PACE}${FIX}scale=768:768,format=yuv420p" \
                  -c:v libx264 -preset slow -crf 20 -an -movflags +faststart "$OUT/$name" ;;
            esac
            echo "$name: $(du -h "$OUT/$name" | cut -f1)"
          done
      - name: Commit
        env:
          PATIENT: ${{ inputs.patient }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "web/public/avatars/$PATIENT"
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Avatar assets for $PATIENT"
          git push origin "HEAD:${GITHUB_REF_NAME}"
