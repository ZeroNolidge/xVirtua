name: Vendor check

# Calls the real Claude, OpenAI and Cartesia APIs with the repo secrets and
# writes a report (job summary + artifact). Costs a few cents per run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - name: Run vendor check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          REPORT: vendor-report.md
        run: npx tsx scripts/vendor-check.ts
      - name: Job summary
        if: always()
        run: '[ -f vendor-report.md ] && cat vendor-report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-report
          path: vendor-report.md
